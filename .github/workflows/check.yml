name: Check

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Build a site signed with a throwaway key and install from it
        run: |
          export GNUPGHOME=$(mktemp -d)
          gpg --batch --passphrase '' --quick-gen-key 'Test <test@invalid>' ed25519 sign 1d
          fpr=$(gpg --list-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')
          gpg --armor --export "$fpr" > "$RUNNER_TEMP/test-key.asc"
          tools/build-index _site --sign "$fpr"
          tests/smoke-test _site "$RUNNER_TEMP/test-key.asc"
